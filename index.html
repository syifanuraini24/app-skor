<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pencatat Skor Olahraga</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body { background-color: #f8f9fa; }
    .score-box { font-size: 4rem; font-weight: bold; text-align: center; }
    .btn-score { font-size: 2rem; width: 100%; border-radius: 10px; }
  </style>
</head>
<body>

  <!-- HALAMAN LOGIN -->
  <div id="loginSection" class="container py-5 mx-auto" style="max-width: 400px;">
    <div class="card shadow-sm mt-5">
      <div class="card-body p-4">
        <h4 class="text-center mb-4">🔒 Login Petugas</h4>
        <input type="text" id="username" class="form-control mb-3 form-control-lg" placeholder="Username">
        <input type="password" id="password" class="form-control mb-4 form-control-lg" placeholder="Password">
        <button class="btn btn-primary w-100 btn-lg shadow-sm" id="btnLogin" onclick="prosesLogin()">Masuk Aplikasi</button>
      </div>
    </div>
  </div>

  <!-- APLIKASI SKOR -->
  <div id="appSection" class="container py-4 mx-auto" style="max-width: 500px; display: none;">
    <h3 class="text-center mb-4">🏆 Live Score Tracker</h3>

    <div class="mb-4">
      <select id="olahraga" class="form-select form-select-lg shadow-sm">
        <option value="Badminton">Badminton</option>
        <option value="Padel">Padel</option>
        <option value="Tenis">Tenis</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>

    <div class="row g-3">
      <!-- Tim A -->
      <div class="col-6">
        <div class="card shadow-sm h-100">
          <div class="card-body text-center p-2">
            <input type="text" id="timA" class="form-control text-center mb-2 fw-bold" value="Tim A">
            <div class="score-box text-primary" id="scoreA">0</div>
            <button class="btn btn-primary btn-score mb-2" onclick="updateScore('A', 1)">+</button>
            <button class="btn btn-outline-danger btn-score" onclick="updateScore('A', -1)">-</button>
          </div>
        </div>
      </div>

      <!-- Tim B -->
      <div class="col-6">
        <div class="card shadow-sm h-100">
          <div class="card-body text-center p-2">
            <input type="text" id="timB" class="form-control text-center mb-2 fw-bold" value="Tim B">
            <div class="score-box text-success" id="scoreB">0</div>
            <button class="btn btn-success btn-score mb-2" onclick="updateScore('B', 1)">+</button>
            <button class="btn btn-outline-danger btn-score" onclick="updateScore('B', -1)">-</button>
          </div>
        </div>
      </div>
    </div>

    <div class="mt-4">
      <button class="btn btn-dark w-100 btn-lg mb-2 shadow-sm" onclick="simpanData()" id="btnSimpan">
        💾 Simpan Hasil Akhir
      </button>
      <button class="btn btn-outline-secondary w-100 btn-lg" onclick="resetScore()">
        🔄 Reset Skor
      </button>
    </div>
  </div>

  <script>
    // PASTE URL WEB APP DARI GOOGLE APPS SCRIPT DI SINI
    const scriptURL = 'https://script.google.com/macros/s/AKfycbz22_SBJMgqZpLc-kqT9rIyLbSbut6NO6ykXl7mZlrcvnDIwqIFTgKmLqP-Q3Qslq9F/exec';
    
    let scoreA = 0;
    let scoreB = 0;

    function prosesLogin() {
      const btnLogin = document.getElementById('btnLogin');
      const user = document.getElementById('username').value;
      const pass = document.getElementById('password').value;

      if(user === '' || pass === '') {
        alert('Username dan Password harus diisi!');
        return;
      }

      btnLogin.innerText = 'Mengecek...';
      btnLogin.disabled = true;

      const formData = new FormData();
      formData.append('action', 'login');
      formData.append('username', user);
      formData.append('password', pass);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
          if (data.result === 'success') {
            document.getElementById('loginSection').style.display = 'none';
            document.getElementById('appSection').style.display = 'block';
          } else {
            alert('Username atau Password salah!');
            btnLogin.innerText = 'Masuk Aplikasi';
            btnLogin.disabled = false;
          }
        })
        .catch(error => {
          alert('Gagal menghubungi server. Periksa koneksi.');
          btnLogin.innerText = 'Masuk Aplikasi';
          btnLogin.disabled = false;
        });
    }

    function updateScore(team, point) {
      if (team === 'A') {
        scoreA += point;
        if (scoreA < 0) scoreA = 0;
        document.getElementById('scoreA').innerText = scoreA;
      } else {
        scoreB += point;
        if (scoreB < 0) scoreB = 0;
        document.getElementById('scoreB').innerText = scoreB;
      }
    }

    function resetScore() {
      scoreA = 0;
      scoreB = 0;
      document.getElementById('scoreA').innerText = scoreA;
      document.getElementById('scoreB').innerText = scoreB;
    }

    function simpanData() {
      const btnSimpan = document.getElementById('btnSimpan');
      const olahraga = document.getElementById('olahraga').value;
      const timA = document.getElementById('timA').value || 'Tim A';
      const timB = document.getElementById('timB').value || 'Tim B';

      btnSimpan.innerText = 'Menyimpan...';
      btnSimpan.disabled = true;

      const formData = new FormData();
      formData.append('action', 'simpan');
      formData.append('olahraga', olahraga);
      formData.append('timA', timA);
      formData.append('timB', timB);
      formData.append('skorA', scoreA);
      formData.append('skorB', scoreB);

      fetch(scriptURL, { method: 'POST', body: formData })
        .then(response => response.json())
        .then(data => {
          alert('Hasil skor berhasil disimpan ke Spreadsheet!');
          resetScore();
          btnSimpan.innerText = '💾 Simpan Hasil Akhir';
          btnSimpan.disabled = false;
        })
        .catch(error => {
          alert('Gagal menyimpan skor.');
          btnSimpan.innerText = '💾 Simpan Hasil Akhir';
          btnSimpan.disabled = false;
        });
    }
  </script>
</body>
</html>
